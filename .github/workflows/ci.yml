name: CI / Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-v2:
    name: v4 (Vite + TS + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (50 scenarios)
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2-dist
          path: v2/dist/
          retention-days: 7

  test-legacy:
    name: v3 legacy (Node MJS validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run legacy test_bayes.mjs (50 scenarios)
        run: node scripts/test_bayes.mjs
